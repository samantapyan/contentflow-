services:
  postgres:
    image: postgres:16-alpine
    container_name: contentflow-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: contentflow
      POSTGRES_DB: contentflow
    volumes:
      - contentflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contentflow -d contentflow']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  contentflow-pgdata:
